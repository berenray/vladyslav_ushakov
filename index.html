<style>
  :root {
    /* AI LAB design tokens */
    --ai-gold:        #F8D74A;
    --ai-gold-muted:  #C9A227;
    --ai-ink:         #0F0F11;
    --ai-card-dark:   #1A1B1F;
    --ai-paper:       #F2F2F4;
    --ai-white:       #FFFFFF;
    --ai-text-dark:   #0F0F11;
    --ai-text-muted:  #6B6B70;

    --radius-card: 24px;
    --radius-pill: 999px;

    --font-display: 'Unbounded', system-ui, sans-serif;
    --font-body: 'Golos Text', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--font-body);
    background: var(--ai-paper);
    color: var(--ai-text-dark);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background-image:
      radial-gradient(120% 70% at 50% -10%, #FFFFFF 0%, var(--ai-paper) 60%);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    width: 100%;
    max-width: 520px;
    padding: 30px 20px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- Socials (top) ---------- */
  .socials {
    display: flex;
    gap: 12px;
    margin-top: 22px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .social {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--ai-white);
    color: var(--ai-text-dark);
    border: 1px solid rgba(15,15,17,0.10);
    transition: transform .12s ease, background .2s ease, color .2s ease;
  }
  .social:hover { background: var(--ai-gold); color: var(--ai-text-dark); transform: translateY(-2px); border-color: transparent; }
  .social svg { width: 22px; height: 22px; }

  /* ---------- Profile ---------- */
  .avatar {
    width: 112px;
    height: 112px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--ai-white);
    border: 3px solid var(--ai-gold);
    margin-bottom: 18px;
    display: grid;
    place-items: center;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 34px;
    color: var(--ai-gold-muted);
    overflow: hidden;
  }

  .name {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 26px;
    letter-spacing: -0.02em;
    text-align: center;
    line-height: 1.15;
  }
  .name .hl {
    background: var(--ai-gold);
    color: var(--ai-text-dark);
    padding: 0 8px;
    border-radius: 6px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .handle {
    margin-top: 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ai-text-muted);
  }
  .bio {
    margin-top: 14px;
    text-align: center;
    font-size: 15px;
    line-height: 1.5;
    color: var(--ai-text-muted);
    max-width: 380px;
  }

  /* ---------- Links ---------- */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 30px;
  }

  .link {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    background: var(--ai-white);
    color: var(--ai-text-dark);
    text-decoration: none;
    border-radius: var(--radius-card);
    padding: 14px 18px;
    min-height: 76px;
    font-weight: 600;
    font-size: 16px;
    transition: transform .12s ease, box-shadow .2s ease;
    border: 1px solid rgba(15,15,17,0.08);
  }
  .link:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(15,15,17,0.08); }
  .link:active { transform: translateY(0); }

  /* Primary / featured link = gold fill */
  .link--primary {
    background: var(--ai-gold);
    color: var(--ai-text-dark);
    border-color: transparent;
  }
  .link--primary:hover { background: #ffe066; box-shadow: 0 8px 22px rgba(248,215,74,0.45); }
  .link--primary .link__icon { color: var(--ai-text-dark); }

  /* Media on the left: image thumbnail OR svg icon */
  .link__media {
    flex: 0 0 52px;
    width: 52px;
    height: 52px;
    border-radius: 14px;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: var(--ai-paper);
  }
  .link--primary .link__media { background: rgba(15,15,17,0.08); }
  .link__media img { width: 100%; height: 100%; object-fit: cover; }

  .link__icon {
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    color: var(--ai-gold-muted);
  }
  .link__icon svg { width: 24px; height: 24px; }

  .link__label { flex: 1; text-align: center; padding-right: 52px; line-height: 1.3; }

  .link__badge {
    position: absolute;
    top: -8px;
    right: 16px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: var(--ai-ink);
    color: var(--ai-gold);
    padding: 3px 9px;
    border-radius: var(--radius-pill);
  }

  /* ---------- Share button ---------- */
  .share {
    margin-top: 30px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    color: var(--ai-text-muted);
    border: 1px solid rgba(15,15,17,0.16);
    border-radius: var(--radius-pill);
    padding: 10px 20px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  .share:hover { color: var(--ai-text-dark); border-color: var(--ai-gold); }
  .share svg { width: 18px; height: 18px; }

  /* ---------- Footer ---------- */
  .footer {
    margin-top: 40px;
    text-align: center;
    font-size: 12px;
    color: var(--ai-text-muted);
  }
  .footer b {
    font-family: var(--font-display);
    color: var(--ai-text-dark);
  }
  .footer b i { font-style: normal; background: var(--ai-gold); padding: 1px 6px; border-radius: 5px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ai-ink);
    color: var(--ai-gold);
    font-weight: 600;
    font-size: 14px;
    padding: 12px 22px;
    border-radius: var(--radius-pill);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 400px) {
    .name { font-size: 23px; }
  }
  /* ---------- In-app browser fallback sheet ---------- */
  .env { opacity: .5; font-size: 11px; }

  .iab {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(15,15,17,0.55);
    display: flex; align-items: flex-end; justify-content: center;
    padding: 16px;
  }
  .iab__box {
    width: 100%; max-width: 460px;
    background: var(--ai-white);
    border-radius: 22px;
    padding: 22px 20px 16px;
    box-shadow: 0 -8px 40px rgba(15,15,17,0.25);
  }
  .iab__title {
    font-family: var(--font-display); font-weight: 800;
    font-size: 18px; line-height: 1.25; margin-bottom: 8px;
  }
  .iab__text { font-size: 14px; line-height: 1.5; color: var(--ai-text-muted); margin-bottom: 16px; }
  .iab__text b { color: var(--ai-text-dark); }
  .iab__btn {
    display: block; width: 100%; text-align: center;
    padding: 14px 16px; margin-bottom: 10px;
    border-radius: 14px; border: 1px solid rgba(15,15,17,0.14);
    background: var(--ai-paper); color: var(--ai-text-dark);
    font-family: var(--font-body); font-weight: 600; font-size: 15px;
    text-decoration: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .iab__btn--primary { background: var(--ai-gold); border-color: transparent; }
  .iab__btn:active { opacity: .75; }
  .iab__url {
    font-size: 12px; color: var(--ai-text-muted);
    word-break: break-all; user-select: all; -webkit-user-select: all;
    padding: 10px 12px; border-radius: 10px; background: var(--ai-paper);
    margin-bottom: 10px;
  }
  .iab__close {
    display: block; width: 100%; padding: 10px;
    background: none; border: 0; cursor: pointer;
    font-family: var(--font-body); font-size: 14px; color: var(--ai-text-muted);
  }

</style>
<script>
/* Визначаємо середовище до рендера: у вебв'ю TikTok/Instagram/Facebook
   посилання не можна відкривати в новій вкладці — там вони просто гинуть. */
window.__ANDROID = /Android/i.test(navigator.userAgent || '');
window.__IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent || '') ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
window.__IAB = /BytedanceWebview|musical_ly|trill|TikTok|Instagram|FBAN|FBAV|FB_IAB|Snapchat|Line\/|Twitter/i
               .test(navigator.userAgent || '');
</script>

<script>
/* =========================================================================

     буде картинка замість іконки. Якщо thumb немає — показується "icon".
   ========================================================================= */
const CONFIG = {
  avatar: "https://ugc.production.linktr.ee/2ba7ea03-fc22-4978-8ee1-aabad60b02ba_photo-2026-04-02-18.56.01.jpeg?io=true&size=avatar-v3_0",

  instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>',
  youtube:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 12s0-3.2-.4-4.7a2.5 2.5 0 0 0-1.8-1.8C19.3 5 12 5 12 5s-7.3 0-8.8.5A2.5 2.5 0 0 0 1.4 7.3C1 8.8 1 12 1 12s0 3.2.4 4.7a2.5 2.5 0 0 0 1.8 1.8C4.7 19 12 19 12 19s7.3 0 8.8-.5a2.5 2.5 0 0 0 1.8-1.8C23 15.2 23 12 23 12zM9.8 15.3V8.7l6 3.3z"/></svg>',

};
function icon(name) { return ICONS[name] || ICONS.link; }

/* ---------- Рендер ---------- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.getElementById('name').innerHTML = CONFIG.name;   // дозволяємо <span class='hl'>
document.getElementById('handle').textContent = CONFIG.handle;
document.getElementById('bio').textContent = CONFIG.bio;
document.getElementById('year').textContent = new Date().getFullYear();

// Avatar
const avatarEl = document.getElementById('avatar');
if (CONFIG.avatar) {
  avatarEl.innerHTML = '<img src="' + esc(CONFIG.avatar) + '" alt="' + esc(CONFIG.handle) +
    '" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';
}

// Socials
const socialsEl = document.getElementById('socials');
CONFIG.socials.forEach(s => {
  const a = document.createElement('a');
  a.className = 'social';
  a.href = s.url;
  a.setAttribute('aria-label', s.name);
  if (/^https?:/i.test(s.url) && !window.__IAB) { a.target = '_blank'; a.rel = 'noopener'; }
  a.innerHTML = icon(s.name);
  socialsEl.appendChild(a);
});

// Links
const linksEl = document.getElementById('links');
CONFIG.links.forEach(l => {
  const a = document.createElement('a');
  a.className = 'link' + (l.type === 'primary' ? ' link--primary' : '');
  a.href = l.url;
  if (/^https?:/i.test(l.url) && !window.__IAB) { a.target = '_blank'; a.rel = 'noopener'; }

  if (l.badge) {
    const b = document.createElement('span');
    b.className = 'link__badge';
    b.textContent = l.badge;
    a.appendChild(b);
  }

  const media = document.createElement('span');
  media.className = 'link__media';
  const fallbackIcon = () => { media.innerHTML = '<span class="link__icon">' + icon(l.icon) + '</span>'; };
  if (l.thumb) {
    const img = document.createElement('img');
    img.src = l.thumb;
    img.alt = '';
    img.loading = 'lazy';
    img.addEventListener('error', fallbackIcon); // якщо файлу картинки немає — показуємо іконку
    media.appendChild(img);
  } else {
    fallbackIcon();
  }
  a.appendChild(media);

  const label = document.createElement('span');
  label.className = 'link__label';
  label.textContent = l.label;
  a.appendChild(label);

  linksEl.appendChild(a);
});

// Share
const toast = document.getElementById('toast');
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}
document.getElementById('shareBtn').addEventListener('click', async () => {
  const data = { title: document.title, url: location.href };
  if (navigator.share) {
    try { await navigator.share(data); } catch(e){}
  } else {
    try {
      await navigator.clipboard.writeText(location.href);
      showToast('Посилання скопійовано ✓');
    } catch(e) { showToast('Не вдалося скопіювати'); }
  }
});
</script>
<!-- =========================================================================
     In-app browser handoff (TikTok / Instagram / Facebook / Snapchat)

     Ці вебв'ю блокують не домен призначення, а саму навігацію зі сторінки:
     перевірено, що заглушка "відкрий у браузері" зʼявляється навіть на
     перехід на свій же домен. Тому проміжного переходу тут немає взагалі:

     1) Telegram-кнопки віддаємо операційній системі прямо з цієї сторінки
        (tg:// на iOS, intent:// на Android) — навігації, яку можна заблокувати,
        не відбувається;
     2) решту посилань пробуємо відкрити в тому ж вікні;
     3) якщо за 1.4 с застосунок не відкрився — показуємо власний екран
        із копіюванням посилання та інструкцією "⋯ → Відкрити в браузері".

     У звичайних браузерах модуль не робить нічого.
     ========================================================================= -->
<script>
(function () {
  var BUILD = 'v3';
  var IAB = window.__IAB, isAndroid = window.__ANDROID, isIOS = window.__IOS;
  var BOT = 'vladushakovai_bot';

  // Видимий маркер: єдиний спосіб переконатися, що скрипт узагалі виконався
  // всередині вебвʼю — консолі там немає.
  var tag = document.getElementById('envTag');
  if (tag) tag.textContent = '· ' + BUILD + (IAB ? ' · in-app' : '');

  if (!IAB) return;

  /* ---------- Telegram-хендофф ---------- */

  // Розпізнаємо і /tg?r=<payload>, і пряме t.me/<bot>?start=<payload>.
  function tgTarget(href) {
    var u;
    try { u = new URL(href, location.href); } catch (e) { return null; }

    var bot, payload;
    if (/(^|\.)t\.me$/i.test(u.hostname)) {
      bot = (u.pathname.replace(/^\//, '').split('/')[0] || '');
      payload = u.searchParams.get('start') || '';
    } else if (/^\/tg\/?$/.test(u.pathname)) {
      bot = u.searchParams.get('bot') || BOT;
      payload = u.searchParams.get('r') || u.searchParams.get('start') || u.searchParams.get('s') || '';
    } else {
      return null;
    }
    if (!bot) return null;

    bot = bot.replace(/^@/, '');
    var https = 'https://t.me/' + encodeURIComponent(bot) +
                (payload ? '?start=' + encodeURIComponent(payload) : '');
    var app = isAndroid
      ? 'intent://resolve?domain=' + encodeURIComponent(bot) +
        (payload ? '&start=' + encodeURIComponent(payload) : '') +
        '#Intent;scheme=tg;S.browser_fallback_url=' + encodeURIComponent(https) + ';end'
      : 'tg://resolve?domain=' + encodeURIComponent(bot) +
        (payload ? '&start=' + encodeURIComponent(payload) : '');

    return { https: https, app: app };
  }

  /* ---------- Фолбек-екран ---------- */

  var sheet = null, timer = null;

  function disarm() {
    if (timer) { clearTimeout(timer); timer = null; }
  }
  function arm(url, ms) {
    disarm();
    timer = setTimeout(function () {
      if (!document.hidden) showSheet(url);
    }, ms);
  }
  // Якщо застосунок відкрився — вкладка ховається, фолбек не потрібен.
  document.addEventListener('visibilitychange', function () { if (document.hidden) disarm(); });
  window.addEventListener('pagehide', disarm);

  function showSheet(url) {
    if (sheet) { sheet.querySelector('#iabUrl').textContent = url; sheet.dataset.url = url; return; }

    sheet = document.createElement('div');
    sheet.className = 'iab';
    sheet.dataset.url = url;
    sheet.innerHTML =
      '<div class="iab__box">' +
        '<div class="iab__title">Відкрийте посилання у браузері</div>' +
        '<p class="iab__text">Вбудований браузер не пускає далі. Натисніть <b>⋯</b> угорі ' +
          'праворуч і оберіть <b>«Відкрити в браузері»</b> — або скопіюйте посилання ' +
          'й вставте його в Safari чи Chrome.</p>' +
        (isIOS ? '<a class="iab__btn iab__btn--primary" id="iabSafari">Відкрити в Safari</a>' : '') +
        '<button class="iab__btn" id="iabCopy" type="button">Скопіювати посилання</button>' +
        '<div class="iab__url" id="iabUrl"></div>' +
        '<button class="iab__close" id="iabClose" type="button">Закрити</button>' +
      '</div>';
    document.body.appendChild(sheet);
    sheet.querySelector('#iabUrl').textContent = url;

    var safari = sheet.querySelector('#iabSafari');
    if (safari) safari.href = 'x-safari-' + sheet.dataset.url;

    sheet.querySelector('#iabClose').addEventListener('click', function () {
      sheet.remove(); sheet = null;
    });
    sheet.querySelector('#iabCopy').addEventListener('click', function () {
      var btn = this, old = btn.textContent, text = sheet.dataset.url;
      var done = function () {
        btn.textContent = 'Скопійовано ✓';
        setTimeout(function () { btn.textContent = old; }, 1800);
      };
      function legacy() {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
        document.body.appendChild(ta);
        ta.select(); ta.setSelectionRange(0, 99999);
        try { document.execCommand('copy'); done(); }
        catch (e) { btn.textContent = 'Виділіть посилання нижче'; }
        document.body.removeChild(ta);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, legacy);
      } else { legacy(); }
    });
  }

  /* ---------- Перехоплення ---------- */

  // Своя реалізація closest: у e.target може опинитися <svg>/<path>,
  // де closest є не в кожному вебвʼю.
  function anchorFrom(node) {
    while (node && node !== document) {
      if (node.nodeType === 1 && node.tagName && node.tagName.toLowerCase() === 'a') return node;
      node = node.parentNode;
    }
    return null;
  }

  var _open = window.open;
  window.open = function (url) {
    if (url) { go(String(url)); return null; }
    return _open.apply(window, arguments);
  };

  function go(href) {
    var t = tgTarget(href);
    if (t) {
      // Схема застосунку — не http-навігація, вебвʼю віддає її системі.
      arm(t.https, 1400);
      try { location.href = t.app; } catch (e) { disarm(); showSheet(t.https); }
    } else {
      arm(href, 1500);
      try { location.href = href; } catch (e) { disarm(); showSheet(href); }
    }
  }

  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button > 0 || e.metaKey || e.ctrlKey) return;
    var a = anchorFrom(e.target);
    if (!a) return;
    var href = a.href;
    if (!href || !/^https?:/i.test(href)) return;   // mailto:/tel: лишаємо системі
    e.preventDefault();
    e.stopPropagation();
    go(href);
  }, true);
})();
</script>
</body>
